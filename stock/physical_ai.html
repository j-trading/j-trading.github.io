/* ── 颜色配置 ── */
const COLORS = {
    root:       '#a78bfa',
    layer:      ['#4fc3f7', '#ffb74d', '#81c784', '#e57373'],
    domain:     '#90a4ae',
    subdomain:  '#78909c',
    stock:      '#ffcc80'
};

/* ── 递归构建 ECharts tree 数据 ── */
function buildTree(data) {
    const root = {
        name: data.name,
        value: formatRootValue(data),
        itemStyle: {
            color: COLORS.root,
            borderColor: '#c4b5fd',
            borderWidth: 3,
            shadowBlur: 18,
            shadowColor: 'rgba(167,139,250,0.5)'
        },
        lineStyle: { color: 'rgba(167,139,250,0.35)', width: 2 },
        label: { fontSize: 16, fontWeight: 700, color: '#e8e0ff' },
        _meta: {
            type: 'root',
            desc: data.description || '',
            market_cagr: data.market_cagr || '',
            market_size_2032: data.market_size_2032 || '',
            market_size_2040: data.market_size_2040 || ''
        },
        children: []
    };

    (data.children || []).forEach((layer, li) => {
        const layerColor = COLORS.layer[li] || COLORS.layer[0];
        const layerNode = {
            name: layer.name,
            value: layer.subtitle || '',
            itemStyle: {
                color: layerColor,
                borderColor: layerColor,
                borderWidth: 2,
                shadowBlur: 12,
                shadowColor: layerColor + '66'
            },
            lineStyle: { color: layerColor + '40', width: 1.5 },
            label: { fontSize: 14, fontWeight: 600, color: layerColor },
            _meta: {
                type: 'layer',
                desc: layer.description || '',
                subtitle: layer.subtitle || ''
            },
            children: []
        };

        (layer.children || []).forEach((domain, di) => {
            if (domain.sub_domains) {
                /* 硬件层：domain → sub_domains → stocks */
                const domainNode = {
                    name: domain.name,
                    value: '',
                    itemStyle: { color: COLORS.domain, borderColor: COLORS.domain, borderWidth: 1.5 },
                    lineStyle: { color: COLORS.domain + '30', width: 1 },
                    label: { fontSize: 12, color: '#b0bec5' },
                    _meta: { type: 'domain', desc: domain.description || '' },
                    children: []
                };

                (domain.sub_domains || []).forEach((sub, si) => {
                    const subNode = {
                        name: sub.name,
                        value: '',
                        itemStyle: { color: COLORS.subdomain, borderColor: COLORS.subdomain, borderWidth: 1 },
                        lineStyle: { color: COLORS.subdomain + '25', width: 1 },
                        label: { fontSize: 11, color: '#90a4ae' },
                        _meta: { type: 'subdomain', desc: '' },
                        children: (sub.stocks || []).map(stock => makeStockNode(stock))
                    };
                    domainNode.children.push(subNode);
                });

                layerNode.children.push(domainNode);
            } else if (domain.stocks) {
                /* 其他层：domain → stocks */
                const domainNode = {
                    name: domain.name,
                    value: '',
                    itemStyle: { color: COLORS.domain, borderColor: COLORS.domain, borderWidth: 1.5 },
                    lineStyle: { color: COLORS.domain + '30', width: 1 },
                    label: { fontSize: 12, color: '#b0bec5' },
                    _meta: { type: 'domain', desc: domain.description || '' },
                    children: (domain.stocks || []).map(stock => makeStockNode(stock))
                };
                layerNode.children.push(domainNode);
            }
        });

        root.children.push(layerNode);
    });

    return root;
}

function makeStockNode(stock) {
    return {
        name: stock.name,
        value: stock.code || '',
        itemStyle: {
            color: COLORS.stock,
            borderColor: '#ffe0b2',
            borderWidth: 1,
            shadowBlur: 4,
            shadowColor: 'rgba(255,204,128,0.3)'
        },
        lineStyle: { color: COLORS.stock + '25', width: 1 },
        label: { fontSize: 10, color: '#d7ccc8' },
        _meta: {
            type: 'stock',
            code: stock.code || '',
            market: stock.market || '',
            exchange: stock.exchange || '',
            role: stock.role || '',
            market_share: stock.market_share || '',
            highlight: stock.highlight || ''
        }
    };
}

function formatRootValue(data) {
    const parts = [];
    if (data.market_cagr) parts.push('CAGR ' + data.market_cagr);
    if (data.market_size_2032) parts.push('2032: ' + data.market_size_2032);
    return parts.join(' | ');
}

/* ── 构建树 ── */
const treeData = buildTree(DATA);

/* ── 初始化图表 ── */
const chart = echarts.init(document.getElementById('main'));

const option = {
    tooltip: {
        trigger: 'item',
        triggerOn: 'mousemove',
        formatter: function(params) {
            const d = params.data;
            const meta = d._meta || {};
            const type = meta.type;

            if (type === 'root') {
                return '<div style="font-size:15px;font-weight:700;color:#a78bfa;margin-bottom:6px;">' + d.name + '</div>'
                     + '<div style="color:#8899aa;font-size:12px;margin-bottom:4px;">Physical AI</div>'
                     + (meta.desc ? '<div style="color:#b0bec5;font-size:12px;line-height:1.5;max-width:280px;">' + meta.desc + '</div>' : '')
                     + '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">'
                     + (meta.market_cagr ? '<span style="background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);border-radius:4px;padding:3px 8px;font-size:11px;color:#c4b5fd;">📈 ' + meta.market_cagr + '</span>' : '')
                     + (meta.market_size_2032 ? '<span style="background:rgba(79,195,247,0.15);border:1px solid rgba(79,195,247,0.3);border-radius:4px;padding:3px 8px;font-size:11px;color:#4fc3f7;">🎯 ' + meta.market_size_2032 + '</span>' : '')
                     + (meta.market_size_2040 ? '<span style="background:rgba(255,183,77,0.15);border:1px solid rgba(255,183,77,0.3);border-radius:4px;padding:3px 8px;font-size:11px;color:#ffb74d;">🚀 ' + meta.market_size_2040 + '</span>' : '')
                     + '</div>';
            }

            if (type === 'layer') {
                return '<div style="font-size:14px;font-weight:600;color:' + (d.itemStyle.color || '#fff') + ';margin-bottom:4px;">' + d.name + '</div>'
                     + (meta.subtitle ? '<div style="color:#778899;font-size:11px;margin-bottom:4px;">' + meta.subtitle + '</div>' : '')
                     + (meta.desc ? '<div style="color:#b0bec5;font-size:12px;line-height:1.5;max-width:260px;">' + meta.desc.substring(0, 150) + (meta.desc.length > 150 ? '...' : '') + '</div>' : '');
            }

            if (type === 'domain' || type === 'subdomain') {
                let html = '<div style="font-size:13px;font-weight:600;color:#b0bec5;margin-bottom:4px;">' + d.name + '</div>';
                if (meta.desc) html += '<div style="color:#90a4ae;font-size:12px;line-height:1.4;max-width:240px;">' + meta.desc + '</div>';
                return html;
            }

            if (type === 'stock') {
                let html = '<div style="font-size:13px;font-weight:600;color:#ffcc80;margin-bottom:4px;">' + d.name + '</div>';
                if (meta.code) html += '<div style="color:#8899aa;font-family:monospace;font-size:12px;margin-bottom:4px;">' + meta.code + (meta.exchange ? ' · ' + meta.exchange : '') + (meta.market ? ' · ' + meta.market : '') + '</div>';
                if (meta.role) html += '<div style="color:#b0bec5;font-size:12px;margin-bottom:3px;">' + meta.role + '</div>';
                if (meta.market_share) html += '<div style="color:#4fc3f7;font-size:12px;">📊 市场份额: ' + meta.market_share + '</div>';
                if (meta.highlight) html += '<div style="color:#ffb74d;font-size:12px;">⭐ ' + meta.highlight + '</div>';
                return html;
            }

            return d.name;
        },
        backgroundColor: 'rgba(8, 10, 28, 0.95)',
        borderColor: 'rgba(100, 180, 255, 0.3)',
        borderWidth: 1,
        padding: [12, 16],
        textStyle: { color: '#e0e0e0', fontSize: 13 },
        extraCssText: 'border-radius:8px;backdrop-filter:blur(6px);box-shadow:0 4px 20px rgba(0,0,0,0.5);'
    },

    series: [{
        type: 'tree',
        data: [treeData],

        /* 布局配置 */
        layout: 'orthogonal',
        orient: 'LR',
        edgeShape: 'polyline',
        edgeForkPosition: '63%',

        /* 根节点位置 */
        top: '8%',
        bottom: '12%',
        left: '12%',
        right: '22%',

        /* 交互 */
        roam: true,
        zoom: 0.9,

        /* 初始展开层级（2层：根+4个层） */
        initialTreeDepth: 2,

        /* 标签 */
        label: {
            show: true,
            position: 'right',
            verticalAlign: 'middle',
            align: 'left',
            fontSize: 12,
            color: '#c0ccd8',
            distance: 8,
            formatter: function(params) {
                const meta = params.data._meta || {};
                if (meta.type === 'stock' && meta.code) {
                    return params.name + '  {' + params.dataIndex + 'code|' + meta.code + '}';
                }
                return params.name;
            },
            rich: {
                code: {
                    fontSize: 9,
                    color: '#667788',
                    fontFamily: 'monospace',
                    padding: [0, 0, 0, 4]
                }
            }
        },

        /* 叶子节点标签 */
        leaves: {
            label: {
                position: 'right',
                verticalAlign: 'middle',
                align: 'left'
            }
        },

        /* 连线样式 */
        lineStyle: {
            color: 'rgba(100, 180, 255, 0.12)',
            width: 1.5,
            curveness: 0.5
        },

        /* 选中/高亮 */
        emphasis: {
            focus: 'descendant',
            itemStyle: {
                shadowBlur: 20,
                shadowColor: 'rgba(100,180,255,0.5)'
            },
            lineStyle: {
                width: 2.5
            }
        },

        blur: {
            itemStyle: { opacity: 0.25 },
            lineStyle: { opacity: 0.08 }
        },

        /* 展开/折叠动画 */
        expandAndCollapse: true,
        animationDuration: 550,
        animationDurationUpdate: 750,
        animationEasingUpdate: 'quinticInOut'
    }]
};

chart.setOption(option);

/* ── 响应式 ── */
window.addEventListener('resize', function() {
    chart.resize();
});

/* ── 3秒后自动展开到第3层，让用户看到更多内容 ── */
setTimeout(function() {
    chart.setOption({
        series: [{
            initialTreeDepth: 3
        }]
    });
}, 2500);
</script>
</body>
</html>
