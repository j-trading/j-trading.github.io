const LAYER_COLORS = ['#4fc3f7', '#ffb74d', '#81c784', '#e57373'];
const LAYER_COLORS_LIGHT = ['#b3e5fc', '#ffe0b2', '#c8e6c9', '#ffcdd2'];

function buildGraph(data) {
    const nodes = [];
    const links = [];
    const categories = [
        { name: '物理AI', itemStyle: { color: '#a78bfa' } },
        { name: '基础设施层', itemStyle: { color: '#4fc3f7' } },
        { name: '模型与平台层', itemStyle: { color: '#ffb74d' } },
        { name: '硬件层', itemStyle: { color: '#81c784' } },
        { name: '应用层', itemStyle: { color: '#e57373' } },
        { name: '领域', itemStyle: { color: '#90a4ae' } },
        { name: '股票', itemStyle: { color: '#ffcc80' } }
    ];

    function addNode(id, name, cat, extra = {}) {
        nodes.push({ id, name, category: cat, ...extra });
    }

    function addLink(source, target) {
        links.push({ source, target });
    }

    // Root
    const rootId = 'root';
    addNode(rootId, data.name, 0, {
        symbolSize: 60,
        desc: data.description,
        market_cagr: data.market_cagr,
        market_size_2032: data.market_size_2032,
        market_size_2040: data.market_size_2040,
        itemStyle: { color: '#a78bfa', borderColor: '#c4b5fd', borderWidth: 3 }
    });

    data.children.forEach((layer, li) => {
        const layerId = `layer_${li}`;
        const layerCat = li + 1;
        addNode(layerId, layer.name, layerCat, {
            symbolSize: 40,
            desc: layer.description,
            subtitle: layer.subtitle,
            itemStyle: { borderColor: LAYER_COLORS[li], borderWidth: 2 }
        });
        addLink(rootId, layerId);

        layer.children.forEach((domain, di) => {
            const domainId = `domain_${li}_${di}`;
            let domainDesc = domain.description || '';

            // Handle sub_domains (for 硬件层)
            if (domain.sub_domains) {
                addNode(domainId, domain.name, 5, {
                    symbolSize: 30,
                    desc: domainDesc,
                    itemStyle: { borderColor: LAYER_COLORS_LIGHT[li], borderWidth: 1.5 }
                });
                addLink(layerId, domainId);

                domain.sub_domains.forEach((sub, si) => {
                    const subId = `subdomain_${li}_${di}_${si}`;
                    addNode(subId, sub.name, 5, {
                        symbolSize: 22,
                        desc: '',
                        itemStyle: { borderColor: LAYER_COLORS_LIGHT[li], borderWidth: 1 }
                    });
                    addLink(domainId, subId);

                    if (sub.stocks) {
                        sub.stocks.forEach((stock, sti) => {
                            const stockId = `stock_${li}_${di}_${si}_${sti}`;
                            addNode(stockId, stock.name, 6, {
                                symbolSize: 16,
                                desc: `${stock.role || ''}`,
                                code: stock.code,
                                market_share: stock.market_share || '',
                                highlight: stock.highlight || '',
                                market: stock.market || '',
                                exchange: stock.exchange || '',
                                itemStyle: { color: '#ffe0b2', borderColor: '#ffcc80', borderWidth: 1 }
                            });
                            addLink(subId, stockId);
                        });
                    }
                });
            } else if (domain.stocks) {
                addNode(domainId, domain.name, 5, {
                    symbolSize: 28,
                    desc: domainDesc,
                    itemStyle: { borderColor: LAYER_COLORS_LIGHT[li], borderWidth: 1.5 }
                });
                addLink(layerId, domainId);

                domain.stocks.forEach((stock, sti) => {
                    const stockId = `stock_${li}_${di}_${sti}`;
                    addNode(stockId, stock.name, 6, {
                        symbolSize: 16,
                        desc: `${stock.role || ''}`,
                        code: stock.code,
                        market_share: stock.market_share || '',
                        highlight: stock.highlight || '',
                        market: stock.market || '',
                        exchange: stock.exchange || '',
                        itemStyle: { color: '#ffe0b2', borderColor: '#ffcc80', borderWidth: 1 }
                    });
                    addLink(domainId, stockId);
                });
            }
        });
    });

    return { nodes, links, categories };
}

// Click to zoom and show detail
chart.on('click', function(params) {
    if (params.data.category >= 5) {
        // Zoom into node
        chart.dispatchAction({
            type: 'highlight',
            seriesIndex: 0,
            dataIndex: params.dataIndex
        });
    }
});

// Responsive
window.addEventListener('resize', function() {
    chart.resize();
});

// Auto-center after layout stabilizes
setTimeout(() => {
    chart.dispatchAction({ type: 'restore' });
}, 1500);
</script>
</body>
</html>
